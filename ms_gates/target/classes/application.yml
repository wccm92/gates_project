spring:
  application:
    name: ms-gates

  datasource:
    url: jdbc:postgresql://localhost:5432/fua_db
    username: gates_user
    password: gates_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

# Configuración de dispositivos Axis por molinete
# endpoint para relay/virtual-input Axis VAPIX: /axis-cgi/io/port.cgi?action=6:1/
axis:
  timeout-ms: 3000
  molinetes:
    1:
      ip: 192.168.1.100
      puerto: 80
      usuario: root
      password: changeme
      endpoint: /axis-cgi/io/port.cgi?action=6:1/
    2:
      ip: 192.168.1.101
      puerto: 80
      usuario: root
      password: changeme
      endpoint: /axis-cgi/io/port.cgi?action=6:1/

logging:
  level:
    com.gates.msgates: INFO
    org.hibernate.SQL: WARN
